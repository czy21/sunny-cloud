plugins {
    id 'com.sunny.framework.gradle' apply false
    id 'org.springframework.boot' apply false
    id 'com.gradleup.shadow' apply false
}

group = 'com.sunny'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.sunny.framework.lombok'
    apply plugin: 'com.sunny.flink'

    group = rootProject.version

    dependencyManagement {
        generatedPomCustomization {
            enabled = false
        }
        imports {
            mavenBom "com.sunny:sunny-framework-bom:${sunnyFrameworkVersion}"
        }
    }
}